name: Build images

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.platform.os }}

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        platform:

          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian11"
            phpVersion: "7.4"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian11"
            phpVersion: "8.0"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian11"
            phpVersion: "8.1"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian12"
            phpVersion: "8.1"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian12"
            phpVersion: "8.2"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian12"
            phpVersion: "8.3"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian12"
            phpVersion: "8.4"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian12"
            phpVersion: "8.5"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian13"
            phpVersion: "8.1"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian13"
            phpVersion: "8.2"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian13"
            phpVersion: "8.3"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian13"
            phpVersion: "8.4"
          - os: ubuntu-latest
            platform: linux/amd64
            debianVersion: "debian13"
            phpVersion: "8.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set environment variables
        id: set-env
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
            suffix=-${{ matrix.platform.phpVersion }}-${{ matrix.platform.debianVersion }}
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dockerpress-base-image
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=sha,format=long

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: library/${{ matrix.platform.debianVersion }}/${{ matrix.platform.phpVersion }}/Dockerfile
          platforms: ${{ matrix.platform.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/dockerpress-base-image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ github.repository }}-${{ github.ref_name }}-${{ matrix.platform.platform }}-${{ matrix.platform.debianVersion }}-${{ matrix.platform.phpVersion }}
          cache-to: type=gha,scope=${{ github.repository }}-${{ github.ref_name }}-${{ matrix.platform.platform }}-${{ matrix.platform.debianVersion }}-${{ matrix.platform.phpVersion }},mode=max
          provenance: true
          sbom: true
          build-args: |
            BUILD_DATE=${{ steps.set-env.outputs.build_date }}
